apiVersion: v1
kind: ConfigMap
metadata:
  name: sy-config
  namespace: default
data:
  logging.level.root: "info"
  kis.api.baseUrl: "https://openapi.koreainvestment.com:9443"

  spring.jpa.hibernate.ddl-auto: "update"
  spring.jpa.show-sql: "false"
  spring.jpa.hibernate.naming.physical-strategy: "org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl"

  spring.datasource.url: "jdbc:mysql://(sy-rds...):3306/stockdatabase?serverTimezone=Asia/Seoul"
  spring.datasource.driver-class-name: "com.mysql.cj.jdbc.Driver"

  spring.data.sentinel.master: "mymaster"
  spring.redis.sentinel.nodes: "sy-redis-headless.redis.svc.cluster.local:26379"

  spring.kafka.bootstrap-servers=localhost: "sy-kafka.kafka.svc.cluster.local:9092"
  spring.kafka.consumer.group-id: "volume-rank-consumer-group"
  spring.kafka.producer.key-serializer: "org.apache.kafka.common.serialization.StringSerializer"
  spring.kafka.producer.value-serializer: "org.apache.kafka.common.serialization.StringSerializer"
  spring.kafka.consumer.key-deserializer: "org.apache.kafka.common.serialization.StringDeserializer"
  spring.kafka.consumer.value-deserializer: "org.apache.kafka.common.serialization.StringDeserializer"