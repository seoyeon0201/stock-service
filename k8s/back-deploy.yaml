apiVersion: apps/v1
kind: Deployment
metadata:
  name: stock-backend-deploy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: back
  template:
    metadata:
      labels:
        app: back
    spec:
      containers:
      - name: back
        image: parkseoyeon/sy-backend:v5  # Docker Hub에서 이미지를 가져옵니다.
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: app-config
